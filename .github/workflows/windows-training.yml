name: Windows CPU training and local web tests
on:
  workflow_dispatch:
  push:
    paths: ["camix_director/**", "tests/**", "requirements-train.txt", "*.bat", ".github/workflows/windows-training.yml"]
  pull_request:
    paths: ["camix_director/**", "tests/**", "requirements-train.txt", "*.bat"]
jobs:
  windows-cpu:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install official CPU PyTorch
        run: python -m pip install torch==2.7.0 torchvision==0.22.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install portable dependencies (no Core ML)
        run: python -m pip install -r requirements-train.txt
      - name: Validate dependency environment
        run: python -m pip check
      - name: Test training, HTTP authentication, cancellation and Windows locks
        run: python -m pytest -q
